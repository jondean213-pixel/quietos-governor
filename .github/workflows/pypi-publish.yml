name: Publish to PyPI

# Trusted Publishing via OIDC — no API tokens needed.
# Setup (one-time, on pypi.org):
#   1. Go to https://pypi.org/manage/project/quietos/settings/publishing/
#   2. Add a new publisher:
#      - Owner: jondean213-pixel
#      - Repository: quietos-governor
#      - Workflow: pypi-publish.yml
#      - Environment: (leave blank)
#   3. Revoke the old API token at https://pypi.org/manage/account/token/

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: |
          cp packaging/pyproject.toml ./pyproject.toml
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password — OIDC trusted publishing handles auth
